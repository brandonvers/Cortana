name: Bug report
description: Something behaves differently from how it is documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        **Not for security issues.** If this is a vulnerability, report it
        privately — see SECURITY.md.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest set of steps that shows the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >-
        Output of `node --version`, `pnpm --version`, `claude --version`, your OS
        and architecture, and the commit you are on.
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        Relevant log output. **Redact credentials, tokens, email addresses, and
        anything else personal before pasting.**
      render: text
    validations:
      required: false
