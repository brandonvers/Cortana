name: CI

on:
  push:
    branches: [main]
  # `edited` is not one of GitHub's defaults for pull_request, and without it the
  # title check below can never pass once it has failed: editing the title does
  # not re-run it, and re-running the job replays the original event payload with
  # the old title. The only escape was to push an unrelated commit.
  pull_request:
    types: [opened, synchronize, reopened, edited]

# A red main is an emergency (CONTRIBUTING.md). Cancel superseded runs on
# branches, but never cancel a run on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The two supported deployment targets. Linux is primary; macOS matters
        # because it is the development machine and a supported target, and
        # because native modules behave differently there.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        run: npm install -g pnpm@11.21.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Spike check
        run: pnpm run check:spikes

      - name: Licence check
        run: pnpm run check:licenses

  privacy:
    name: privacy guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # check-private.mjs inspects the full history, not just the tip.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Nothing personal may be published
        run: node scripts/check-private.mjs

  pr-title:
    name: PR title is a conventional commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Merges are squash merges, so the pull request title becomes the commit
      # message on main — and that message is what drives versioning and the
      # changelog. A title that is not a valid Conventional Commit produces a
      # wrong version bump or a missing changelog entry. See docs/RELEASING.md.
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if printf '%s' "$TITLE" | grep -qE "$pattern"; then
            echo "OK: $TITLE"
          else
            echo "::error::Pull request title is not a Conventional Commit: $TITLE"
            echo ""
            echo "Expected:  type(optional-scope): subject"
            echo "Types:     feat fix perf refactor docs test build ci chore revert"
            echo "Breaking:  add ! before the colon, e.g. feat(api)!: drop the v1 route"
            exit 1
          fi

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Every commit must be signed off
        run: |
          missing=0
          range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          for sha in $(git rev-list --no-merges "$range"); do
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if ! git show -s --format='%B' "$sha" | grep -qiE "^Signed-off-by: .+ <.+@.+>$"; then
              echo "::error::commit $sha is missing a Signed-off-by line ($author)"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Sign your commits with 'git commit -s'. See CONTRIBUTING.md."
            exit 1
          fi
          echo "All commits are signed off."
