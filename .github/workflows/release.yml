name: Release

on:
  push:
    branches: [main]
  # To run release-please again by hand, e.g. after closing its pull request.
  workflow_dispatch:

# Only ever one release run at a time, and never cancelled part-way — a
# half-applied release is worse than a delayed one.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # To approve CI on the release pull request; see the last step.
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Opens or updates a release pull request carrying the version bump and
      # the generated changelog entry. Merging that pull request is what creates
      # the tag and the GitHub Release — see docs/RELEASING.md. The review step
      # is deliberate: a mistyped commit type produces a wrong version bump, and
      # this is where it gets caught.
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # For the pull request this job just opened or updated, GitHub creates the CI
      # run and holds it for approval — it shows as "action_required" — because
      # the bot's own token made the push. Measured on 2026-10-10: a CI run
      # started any other way, by dispatch included, is **not** counted towards
      # the pull request's required checks, so the held run is the one that has
      # to go. It is this repository's own CI, on release-please's branch, on a
      # commit the bot just made, and approving it is what lets the ruleset on
      # main see the release checked like everything else.
      #
      # The run appears a moment after the push, so it is looked for for a
      # minute. If this step ever fails, approving it by hand is the same act:
      # "Approve workflows to run" on the pull request.
      - name: Approve CI on the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            ids="$(gh run list --repo "$GITHUB_REPOSITORY" --event pull_request \
              --status action_required --json databaseId,headBranch \
              --jq '.[] | select(.headBranch | startswith("release-please--")) | .databaseId')"
            if [ -n "$ids" ]; then
              for id in $ids; do
                gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve"
                echo "approved CI run $id"
              done
              exit 0
            fi
            sleep 5
          done
          echo "no CI run waiting for approval on a release branch"
